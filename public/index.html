<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lewat Sini</title>
<style>
:root{--bg:#F7F8F9;--card:#fff;--ink:#12181F;--mute:#566176;--line:#DDE2E8;--acc:#0B6E70;--acch:#095A5C;--onacc:#fff;--tint:rgba(11,110,112,.10);--rg:#CBD3DD;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111417;--card:#181C21;--ink:#EDEFF2;--mute:#A0A8B3;--line:#2B3138;--acc:#3CC3C5;--acch:#5DD2D4;--onacc:#06202A;--tint:rgba(60,195,197,.14);--rg:#38404A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111417;--card:#181C21;--ink:#EDEFF2;--mute:#A0A8B3;--line:#2B3138;--acc:#3CC3C5;--acch:#5DD2D4;--onacc:#06202A;--tint:rgba(60,195,197,.14);--rg:#38404A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:8px 16px 32px}
h1{font-size:1.4rem;line-height:1.2;font-weight:650;letter-spacing:-.015em;margin:4px 0 0}
h2{font-size:.875rem;font-weight:600;color:var(--mute);letter-spacing:.01em;margin:24px 0 2px}
.sub,.note{color:var(--mute)}.sub{margin:4px 0 16px}.note{font-size:.9rem;margin:10px 0}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pi{fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:2px;margin-left:-6px;padding:0 8px 0 2px;min-height:44px;color:var(--mute);font-weight:500;text-decoration:none;border-radius:8px;transition:color .15s,background-color .15s}
.back:hover{color:var(--ink)}
.row{display:grid;grid-template-columns:28px 1fr auto;column-gap:12px;align-items:center;min-height:56px;padding:10px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.row>.ic{color:var(--mute)}.row.hot>.ic{color:var(--acc)}
a.row{margin:0 -8px;padding:10px 8px;border-radius:8px;border-top-color:transparent;box-shadow:0 -1px 0 var(--line);transition:background-color .15s}
a.row:hover{background:var(--tint)}a.row:active{background:var(--tint)}
.nm{font-weight:600}.meta{color:var(--mute);font-size:.875rem}.eta{color:var(--acc);font-weight:600;font-size:.875rem}.dist{font-weight:600;text-align:right}
.map{width:100%;display:block;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.rg{fill:none;stroke:var(--rg);stroke-width:1}.lb{fill:var(--mute);font-size:10px;text-anchor:middle}
.pin{fill:var(--card);stroke:var(--ink);stroke-width:1.5}.hz{fill:var(--acc);fill-opacity:.16;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:3 3}
.me{fill:var(--acc);stroke:var(--card);stroke-width:2}.halo{fill:var(--acc);fill-opacity:.18}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-weight:500;transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--mute)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.seg{display:flex;gap:6px;margin-top:8px}.seg .chip{flex:1;padding:0 6px;min-height:44px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;border:1px solid var(--acc);border-radius:8px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:600;transition:background-color .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--acch);border-color:var(--acch)}.btn:active{transform:scale(.985)}
.btn:disabled{background:transparent;border-color:var(--line);color:var(--mute);transform:none}
.btn.go{min-height:56px;font-size:1.05rem;margin:20px 0 8px}
.btn.go[aria-pressed=true]{background:transparent;border-color:var(--mute);color:var(--ink)}
.btn.go[aria-pressed=true]:hover{background:var(--tint)}
.row.sw{grid-template-columns:1fr auto;min-height:60px}
.swt{flex:none;width:52px;height:32px;padding:0;border:1px solid var(--mute);border-radius:16px;background:transparent;position:relative;transition:background-color .15s,border-color .15s}
.swt::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mute);transition:transform .15s,background-color .15s}
.swt[aria-checked=true]{background:var(--acc);border-color:var(--acc)}
.swt[aria-checked=true]::after{transform:translateX(20px);background:var(--onacc)}
.pair{display:flex;gap:8px;align-items:flex-end}.pair select{flex:1;min-width:0}.pair .btn{width:auto;margin:0;padding:0 18px}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}.btn.sec:hover{background:var(--tint);border-color:var(--mute)}
.live{display:flex;align-items:center;gap:8px;margin:0;font-weight:600}.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
label{display:block;margin:0 0 14px;font-weight:600}
input,select{display:block;width:100%;box-sizing:border-box;margin-top:6px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-weight:400;transition:border-color .15s}
input:hover,select:hover{border-color:var(--mute)}
input::placeholder{color:var(--mute)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:8px;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-bakso" viewBox="0 0 24 24"><path d="M3 12h18a9 9 0 0 1-18 0Z"/><path d="M7 21h10"/><path d="M8 3v4M12 3v4M16 3v4"/></symbol>
<symbol id="i-es" viewBox="0 0 24 24"><path d="m7 11 4.08 10.35a1 1 0 0 0 1.84 0L17 11"/><path d="M17 7A5 5 0 0 0 7 7"/><path d="M17 7a2 2 0 0 1 0 4H7a2 2 0 0 1 0-4"/></symbol>
<symbol id="i-sayur" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></symbol>
<symbol id="i-roti" viewBox="0 0 24 24"><path d="M12 22V8"/><path d="M12 8c0-2.2 1.6-3.8 3.5-4 0 2.2-1.6 3.8-3.5 4ZM12 8C12 5.8 10.4 4.2 8.5 4c0 2.2 1.6 3.8 3.5 4Z"/><path d="M12 14c0-2.2 1.6-3.8 3.5-4 0 2.2-1.6 3.8-3.5 4ZM12 14c0-2.2-1.6-3.8-3.5-4 0 2.2 1.6 3.8 3.5 4Z"/></symbol>
<symbol id="i-lain" viewBox="0 0 24 24"><path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
<symbol id="i-store" viewBox="0 0 24 24"><path d="m2 7 2-4h16l2 4"/><path d="M4 12v8h16v-8"/><path d="M2 7h20v2a3 3 0 0 1-6 0 3 3 0 0 1-4 0 3 3 0 0 1-4 0 3 3 0 0 1-6 0Z"/><path d="M10 20v-4h4v4"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
</svg>
<main id="app"><p class="note">Menghubungkan…</p></main>
<div class="toast" id="t" role="status"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,setDoc,collection,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
// ISI dengan konfigurasi Web App dari Firebase Console (Project settings > Your apps).
const firebaseConfig={apiKey:"ISI_API_KEY",authDomain:"ISI_PROJECT.firebaseapp.com",projectId:"ISI_PROJECT_ID",appId:"ISI_APP_ID"};
const $=i=>document.getElementById(i);
const I=(k,c)=>`<svg class="ic${c?' '+c:''}" aria-hidden="true"><use href="#i-${k}"/></svg>`;
const CK=c=>['bakso','es','sayur','roti'].includes(c)?c:'lain';
const ST={jalan:'Berjalan',henti:'Berhenti',istirahat:'Istirahat'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R0=Math.PI/180;
const dist=(a,b)=>Math.hypot((b.lng-a.lng)*111320*Math.cos(a.lat*R0),(b.lat-a.lat)*110540);
const rel=(a,b)=>[(b.lng-a.lng)*111320*Math.cos(a.lat*R0),-(b.lat-a.lat)*110540];
const dir=(x,y)=>['utara','timur laut','timur','tenggara','selatan','barat daya','barat','barat laut'][Math.round(Math.atan2(x,-y)/(Math.PI/4)+8)%8];
const fm=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(1).replace('.',',')+' km';
let db=null,uid=null,subs=[],watch=null,leave=null,tt,wl=null;
const AL0={on:false,r:250,s:'lonceng',v:true},SD={lonceng:'Lonceng',kentongan:'Kentongan',klakson:'Klakson',dering:'Dering'},RD=[100,250,500,1000];
let al={...AL0},ac=null;
try{Object.assign(al,JSON.parse(localStorage.getItem('ls-al')||'{}'))}catch(_){}
if(!SD[al.s])al.s='lonceng';if(!RD.includes(al.r))al.r=250;
const saveAl=()=>{try{localStorage.setItem('ls-al',JSON.stringify(al))}catch(_){}};
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(_){}}
function beep(f,t,d,ty,g){const o=ac.createOscillator(),n=ac.createGain(),s=ac.currentTime+t;o.type=ty;o.frequency.value=f;n.gain.setValueAtTime(.0001,s);n.gain.exponentialRampToValueAtTime(g,s+.01);n.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(n);n.connect(ac.destination);o.start(s);o.stop(s+d+.05)}
function ring(k,vib){unlock();if(ac){
if(k==='lonceng')[0,.5,1].forEach(t=>{beep(1320,t,1.1,'sine',.5);beep(1980,t,.7,'sine',.2)});
else if(k==='kentongan')[0,.3,.6,.9].forEach((t,i)=>beep(i%2?150:190,t,.2,'square',.35));
else if(k==='klakson'){beep(420,0,.35,'sawtooth',.25);beep(420,.5,.35,'sawtooth',.25)}
else[0,.35,.7,1.05].forEach((t,i)=>beep(i%2?880:660,t,.3,'triangle',.4))}
if(vib&&navigator.vibrate)navigator.vibrate([250,120,250,120,400])}
addEventListener('pointerdown',()=>{if(al.on)unlock()},{passive:true});
function toast(m){const t=$('t');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function clean(){if(leave){leave();leave=null}subs.forEach(f=>f());subs=[];unwatch();try{wl&&wl.release();}catch(_){}wl=null}
const G=()=>{const c=window.Capacitor;return c&&c.isNativePlatform&&c.isNativePlatform()&&c.Plugins&&c.Plugins.Geolocation};
function unwatch(){if(!watch)return;const w=watch;watch=null;try{if(w.n)G().clearWatch({id:w.id});else navigator.geolocation.clearWatch(w.id)}catch(_){}}
async function track(ok,bad){const g=G();
if(g){try{const q=await g.requestPermissions();if(q.location==='denied'){bad('Izin lokasi ditolak. Aktifkan lewat Pengaturan aplikasi.');return}
const id=await g.watchPosition({enableHighAccuracy:true,timeout:20000},(p,e)=>{if(e||!p)return bad('Lokasi belum terdeteksi. Coba di tempat terbuka.');ok({lat:p.coords.latitude,lng:p.coords.longitude})});watch={n:1,id}}catch(_){bad('Lokasi tidak bisa diakses.')}return}
if(!navigator.geolocation){bad('Perangkat ini tidak mendukung lokasi.');return}
watch={id:navigator.geolocation.watchPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude}),e=>bad(e.code===1?'Izin lokasi ditolak. Aktifkan izin lokasi lalu muat ulang halaman.':'Lokasi belum terdeteksi. Coba di tempat terbuka.'),{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}}
function chips(id,items,cur,fn){$(id).innerHTML=items.map(c=>`<button class="chip" data-k="${c[0]}" aria-pressed="${c[0]===cur}">${c[1]}</button>`).join('');$(id).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('#'+id+' .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.k)}}

function home(){$('app').innerHTML=`<h1 style="margin-top:28px">Lewat Sini</h1><p class="sub">Temukan pedagang keliling di dekatmu, atau bagikan posisimu saat berjualan.</p><a class="row" href="#pembeli">${I('pin')}<div><div class="nm">Saya pembeli</div><div class="meta">Lihat pedagang dan titik ramai di sekitarmu</div></div>${I('right')}</a><a class="row" href="#pedagang">${I('store')}<div><div class="nm">Saya pedagang</div><div class="meta">Bagikan posisi saat berjualan</div></div>${I('right')}</a>`}

function pembeli(){
$('app').innerHTML=`<a class="back" href="#">${I('left')}Ganti peran</a><h1>Cari pedagang</h1><p class="sub">Pedagang yang sedang berjualan di dekatmu.</p>
<svg id="radar" class="map" viewBox="0 0 300 300" role="img" aria-label="Radar posisi pedagang dan titik ramai di sekitarmu"></svg>
<p class="note" id="msg" role="status"></p>
<button class="btn" id="ask">Minta lewat sini</button>
<h2>Peringatan</h2>
<div class="row sw"><div><div class="nm">Bunyikan saat pedagang dekat</div><div class="meta">Berlaku untuk semua pedagang aktif</div></div><button class="swt" id="alon" role="switch" aria-checked="false" aria-label="Peringatan pedagang dekat"></button></div>
<div id="alset" hidden>
<div class="row sw"><div><div class="nm">Getar</div></div><button class="swt" id="alv" role="switch" aria-checked="false" aria-label="Getar"></button></div>
<div style="margin:12px 0"><label for="alr" style="margin:0">Jarak peringatan</label><select id="alr">${RD.map(r=>`<option value="${r}">${fm(r)}</option>`).join('')}</select></div>
<label for="als" style="margin:0">Suara</label><div class="pair"><select id="als">${Object.entries(SD).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><button class="btn sec" id="alt">Coba</button></div>
<p class="note">Hanya berbunyi saat aplikasi terbuka dan layar menyala.</p></div>
<h2>Titik ramai</h2><div id="hot"></div>
<h2>Pedagang aktif</h2><div class="chips" id="cf"></div><div id="list"></div>`;
let here=null,V=[],S=[],f='semua',cd=0,seen={};
const watchNear=()=>{if(!al.on||!here)return;const now=Date.now();V.forEach(v=>{if(!(v.on&&now-v.t<18e4)){delete seen[v.id];return}const d=dist(here,v);if(d>al.r*1.3){delete seen[v.id];return}if(d<=al.r&&!seen[v.id]){seen[v.id]=1;ring(al.s,al.v);toast((v.n||'Pedagang')+' sudah dekat, '+fm(d)+' dari kamu.')}})};
const draw=()=>{
if(!here){$('list').innerHTML='<p class="note">Menunggu lokasimu…</p>';return}
const now=Date.now();
const vs=V.filter(v=>v.on&&now-v.t<18e4&&(f==='semua'||f===v.c)).map(v=>({...v,d:dist(here,v)})).filter(v=>v.d<=5000).sort((a,b)=>a.d-b.d);
const g={};S.filter(s=>now-s.t<54e5).forEach(s=>{const k=Math.round(s.lat/.001)+','+Math.round(s.lng/.001),o=g[k]||(g[k]={w:0,lat:0,lng:0,n:0});o.w+=s.w;o.lat+=s.lat;o.lng+=s.lng;o.n++});
const sp=Object.values(g).map(o=>({w:o.w,lat:o.lat/o.n,lng:o.lng/o.n})).map(o=>({...o,d:dist(here,o)})).filter(o=>o.d<=3000).sort((a,b)=>b.w-a.w||a.d-b.d).slice(0,3);
const R=Math.max(300,Math.min(3000,Math.max(0,...vs.map(v=>v.d),...sp.map(o=>o.d))*1.15)),k=130/R,P=o=>{const[x,y]=rel(here,o);return[150+Math.max(-135,Math.min(135,x*k)),150+Math.max(-135,Math.min(135,y*k))]};
let h=`<circle class="rg" cx="150" cy="150" r="130"/><circle class="rg" cx="150" cy="150" r="65"/><text class="lb" x="150" y="12">${fm(R)}</text>`;
sp.forEach(o=>{const[x,y]=P(o);h+=`<circle class="hz" cx="${x}" cy="${y}" r="${8+Math.min(o.w,8)*2}"/>`});
vs.forEach(v=>{const[x,y]=P(v);h+=`<g transform="translate(${x} ${y})"><circle class="pin" r="13"/><use class="pi" href="#i-${CK(v.c)}" x="-8" y="-8" width="16" height="16"/></g>`});
h+='<circle class="halo" cx="150" cy="150" r="14"/><circle class="me" cx="150" cy="150" r="6"/><text class="lb" x="150" y="178">Kamu</text>';
$('radar').innerHTML=h;
$('hot').innerHTML=sp.length?sp.map(o=>{const[x,y]=rel(here,o);return`<div class="row hot">${I('flame')}<div><div class="nm">${o.w>=6?'Ramai':o.w>=3?'Cukup ramai':'Ada peminat'}</div><div class="meta">Ke arah ${dir(x,y)}</div></div><div class="dist num">${fm(o.d)}</div></div>`}).join(''):'<p class="note">Belum ada titik ramai. Tekan “Minta lewat sini” untuk menandai tempatmu.</p>';
$('list').innerHTML=vs.length?vs.map(v=>{let e;if(v.st!=='jalan')e='Sedang '+ST[v.st].toLowerCase();else if(v.d<20)e='Sudah dekat';else{const mn=v.d/1.2/60,lo=Math.max(1,Math.round(mn*.8)),hi=Math.max(lo+1,Math.round(mn*1.3));e='Lewat sekitar '+lo+'–'+hi+' menit lagi'}
return`<div class="row">${I(CK(v.c))}<div><div class="nm">${esc(v.n)}</div><div class="eta">${e}</div></div><div class="dist num">${fm(v.d)}</div></div>`}).join(''):'<p class="note">Belum ada pedagang aktif dalam 5 km. Coba lagi sebentar atau tekan “Minta lewat sini”.</p>';watchNear()};
const rf=()=>{$('alon').setAttribute('aria-checked',al.on);$('alv').setAttribute('aria-checked',al.v);$('alset').hidden=!al.on;$('alr').value=al.r;$('als').value=al.s};rf();
$('alon').onclick=()=>{al.on=!al.on;saveAl();rf();if(al.on){unlock();toast('Peringatan menyala.');watchNear()}};
$('alv').onclick=()=>{al.v=!al.v;saveAl();rf();if(al.v&&navigator.vibrate)navigator.vibrate(80)};
$('alr').onchange=e=>{al.r=+e.target.value;saveAl();watchNear()};
$('als').onchange=e=>{al.s=e.target.value;saveAl();ring(al.s,false)};
$('alt').onclick=()=>ring(al.s,al.v);
chips('cf',[['semua','Semua'],['bakso','Bakso'],['es','Es'],['sayur','Sayur'],['roti','Roti']],'semua',k=>{f=k;draw()});
$('ask').onclick=async()=>{if(!here)return toast('Lokasimu belum terdeteksi.');if(Date.now()-cd<6e4)return toast('Tunggu sebentar sebelum meminta lagi.');
try{await db.doc('spots/'+uid).set({lat:+here.lat.toFixed(3),lng:+here.lng.toFixed(3),w:1,src:'beli',t:Date.now()});cd=Date.now();toast('Permintaanmu terkirim ke pedagang sekitar.')}catch(_){toast('Gagal mengirim permintaan.')}};
track(p=>{here=p;draw()},m=>$('msg').textContent=m);
const er=()=>$('msg').textContent='Gagal membaca data bersama.';
subs.push(db.collection('vendors').onSnapshot(s=>{V=s.docs.map(d=>({id:d.id,...d.data()}));draw()},er));
subs.push(db.collection('spots').onSnapshot(s=>{S=s.docs.map(d=>d.data());draw()},er));
setInterval&&subs.push((i=>()=>clearInterval(i))(setInterval(draw,15000)))}

function pedagang(){
$('app').innerHTML=`<a class="back" href="#">${I('left')}Ganti peran</a><h1>Halaman pedagang</h1><p class="sub">Nyalakan saat mulai berkeliling. Pembeli di sekitar bisa melihat posisimu.</p>
<label>Nama dagangan<input id="nm" maxlength="30" placeholder="Contoh: Bakso Pak Darto"></label>
<label>Jenis dagangan<select id="ct"><option value="bakso">Bakso</option><option value="es">Es</option><option value="sayur">Sayur</option><option value="roti">Roti</option><option value="lain">Lainnya</option></select></label>
<button class="btn go" id="go" aria-pressed="false">Mulai jualan</button>
<p class="note" id="msg" role="status"></p>
<div id="mine" hidden><p class="live">Posisimu sedang dibagikan</p><h2>Statusmu</h2><div class="seg" id="seg"></div><h2>Titik ramai</h2><button class="btn" id="hotb" disabled>Ramai di sini</button><p class="eta num" id="wait"></p></div>
<p class="note">Posisimu hanya terlihat saat mode jualan menyala. Biarkan layar menyala agar lokasi terus terkirim.</p>`;
const me={n:'',c:'bakso',st:'jalan',on:false};let pos=null,lp=null,last=0,S=[],cd=0;
try{const s=JSON.parse(localStorage.getItem('ls')||'{}');if(s.n)$('nm').value=s.n;if(s.c)$('ct').value=s.c}catch(_){}
const push=force=>{if(!pos)return;const n=Date.now();if(!force&&lp&&(n-last<1e4||(dist(lp,pos)<10&&n-last<6e4)))return;last=n;lp=pos;
db.doc('vendors/'+uid).set({n:me.n,c:me.c,st:me.st,on:me.on,lat:pos.lat,lng:pos.lng,t:n}).catch(()=>toast('Gagal mengirim lokasi.'))};
const near=()=>{if(!pos)return;const n=Date.now(),c=S.filter(s=>s.src==='beli'&&n-s.t<36e5&&dist(pos,s)<=500).length;$('wait').textContent=c?'Pembeli minta lewat di sekitarmu: '+c:'Belum ada permintaan di sekitarmu.'};
const stop=()=>{me.on=false;unwatch();push(true);try{wl&&wl.release();}catch(_){}wl=null};
leave=()=>{if(me.on)stop()};
chips('seg',Object.keys(ST).map(k=>[k,ST[k]]),'jalan',k=>{me.st=k;if(me.on)push(true)});
$('go').onclick=async()=>{const g=$('go');
if(!me.on){me.n=$('nm').value.trim()||'Dagangan';me.c=$('ct').value;me.st='jalan';me.on=true;
try{localStorage.setItem('ls',JSON.stringify({n:$('nm').value.trim(),c:me.c}))}catch(_){}
document.querySelectorAll('#seg .chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k==='jalan'));
track(p=>{pos=p;$('hotb').disabled=false;push(false);near()},m=>$('msg').textContent=m);
try{wl=await navigator.wakeLock.request('screen')}catch(_){}
toast('Mode jualan menyala. Pembeli kini bisa melihatmu.')}
else{stop();toast('Mode jualan mati. Posisimu tidak lagi terlihat.')}
g.setAttribute('aria-pressed',me.on);g.textContent=me.on?'Berhenti jualan':'Mulai jualan';$('mine').hidden=!me.on};
$('hotb').onclick=async()=>{if(!pos)return;if(Date.now()-cd<6e4)return toast('Tunggu sebentar sebelum menandai lagi.');
try{await db.doc('spots/'+uid).set({lat:+pos.lat.toFixed(3),lng:+pos.lng.toFixed(3),w:3,src:'jual',t:Date.now()});cd=Date.now();toast('Titik ramai tercatat.')}catch(_){toast('Gagal mencatat titik ramai.')}};
subs.push(db.collection('spots').onSnapshot(s=>{S=s.docs.map(d=>d.data());near()},()=>{}))}

async function route(){clean();const r=location.hash.slice(1);
if(r!=='pembeli'&&r!=='pedagang')return home();
if(!db||!uid){$('app').innerHTML='<a class="back" href="#">'+I('left')+'Ganti peran</a><p class="note">Tidak bisa terhubung ke server. Periksa koneksi internet dan konfigurasi Firebase.</p>';return}
(r==='pembeli'?pembeli:pedagang)();scrollTo(0,0)}
(async()=>{try{const app=initializeApp(firebaseConfig),fs=getFirestore(app);uid=(await signInAnonymously(getAuth(app))).user.uid;
db={doc:p=>({set:o=>setDoc(doc(fs,p),o)}),collection:n=>({onSnapshot:(ok,er)=>onSnapshot(collection(fs,n),s=>ok({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),er)})}}catch(_){db=null}
addEventListener('hashchange',route);route()})();
</script></body></html>
